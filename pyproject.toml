[project]
name = "school-finance-agent"
version = "0.1.0"
description = "Claude agent over the school-finance MCP server, with a graded eval suite"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tyler Beauregard" }]
keywords = ["claude", "anthropic", "mcp", "agent", "evals", "school-finance", "sacs"]
dependencies = ["anthropic>=0.40", "mcp>=1.10,<2", "anyio>=4"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "school-finance-mcp @ git+https://github.com/tylermbeau-jpg/school-finance-mcp.git",
]

[project.scripts]
sfagent = "sfagent.cli:main"

[project.urls]
Repository = "https://github.com/tylermbeau-jpg/school-finance-agent"
"MCP server" = "https://github.com/tylermbeau-jpg/school-finance-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# the dev extra installs school-finance-mcp straight from GitHub
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["sfagent"]
